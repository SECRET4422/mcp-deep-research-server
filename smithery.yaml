# Smithery deployment - simplified, buildpack compatible
runtime: typescript
name: mcp-deep-research-server
displayName: Deep Research MCP Server
description: Non-generic Deep Research MCP - search, scrape, synthesize, fact-check, persistent memory. 8 tools, no API keys.
author: SECRET4422
homepage: https://github.com/SECRET4422/mcp-deep-research-server
repository: https://github.com/SECRET4422/mcp-deep-research-server
keywords:
  - research
  - search
  - scraping
  - fact-check
  - deep-research
  - duckduckgo
  - memory
  - mcp
license: MIT

# Smithery will run: npm install && npm run build
# Then start with stdio
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |
    (config) => ({
      command: "node",
      args: ["build/index.js"],
      env: {}
    })

configSchema:
  type: object
  properties: {}
  required: []

exampleQuestions:
  - "Use deep_research to research 'Best way to monetize MCP servers in 2026'"
  - "Fact check: Dehradun is the winter capital of Uttarakhand"
  - "Compare these URLs about MCP architecture"
